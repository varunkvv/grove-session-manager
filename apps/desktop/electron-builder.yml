appId: io.github.varunkvv.grove
productName: Grove
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  # source maps are for development: they add weight and carry the build machine's paths
  - "!out/**/*.map"
  # zed's node runs the proxy, and cannot read inside the asar. it ships in extraResources
  - "!out/acp-proxy/**"
  - package.json
asar: true
# chromium ships ~50 locales. the app has one language.
electronLanguages:
  - en
# nothing is rebuilt. the workspace symlinks are bundled away by esbuild
npmRebuild: false
extraResources:
  - from: ../../extension/dist
    to: extension
    filter:
      - "*.vsix"
      - manifest.json
  - from: out/acp-proxy
    to: acp-proxy
    filter:
      - grove-acp.cjs
mac:
  category: public.app-category.developer-tools
  # the fallback. the icon is resources/Grove.icon, which takes xcode 26's actool to compile, and
  # electron-builder throws without one. so `pnpm package` passes it as -c.mac.icon only when this
  # mac can compile it (scripts/icon-arg.mjs), and CI always does. this picture is that icon
  # rendered once: macOS has no glass to draw from it, and no dark, clear or tinted style
  icon: resources/icon.png
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
  # ad-hoc: an arm64 mac refuses to run a binary with no signature at all. a release is signed again
  # with a self-signed certificate after this (afterSign below), so macOS keeps its screen recording
  # and microphone grants across updates. a local build stays ad-hoc
  identity: "-"
  hardenedRuntime: false
  notarize: false
# signs the app with GROVE_SIGN_IDENTITY when it is set, and does nothing when it is not
afterSign: ./scripts/after-sign.cjs

# the usual drag-to-install window
dmg:
  title: ${productName}
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 150
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
