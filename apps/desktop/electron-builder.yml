appId: io.github.varunkvv.grove
productName: Grove
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  # source maps are for development: they add weight and carry the build machine's paths
  - "!out/**/*.map"
  # zed's node runs the proxy, and cannot read inside the asar. it ships in extraResources
  - "!out/acp-proxy/**"
  - package.json
  # node-llama-cpp (judgment day odds' scorer) is the one dependency that ships as itself. its copy of
  # llama.cpp's source and its project templates are for building one, which the app never does
  - "!node_modules/node-llama-cpp/llama/gitRelease.bundle"
  - "!node_modules/node-llama-cpp/templates/**"
asar: true
# a native addon and its dylibs cannot load from inside the asar. node-llama-cpp looks for them in
# app.asar.unpacked by itself (its electron guide lists these globs)
asarUnpack:
  - node_modules/node-llama-cpp/bins/**
  - node_modules/node-llama-cpp/llama/localBuilds/**
  - node_modules/@node-llama-cpp/**
# chromium ships ~50 locales. the app has one language.
electronLanguages:
  - en
# the one native addon, node-llama-cpp's, is a Node-API prebuilt (@node-llama-cpp/mac-arm64-metal):
# it runs on electron's node as it is, so nothing is rebuilt. the workspace symlinks are bundled
# away by esbuild
npmRebuild: false
# the scorer's first load has node-llama-cpp test its binary in a child process, which from a
# utility process is child_process.fork and needs electron's RunAsNode fuse. it is on by default:
# leave it on, and set no electronFuses here that turn it off
extraResources:
  - from: ../../extension/dist
    to: extension
    filter:
      - "*.vsix"
      - manifest.json
  - from: out/acp-proxy
    to: acp-proxy
    filter:
      - grove-acp.cjs
mac:
  category: public.app-category.developer-tools
  # the fallback. the icon is resources/Grove.icon, which takes xcode 26's actool to compile, and
  # electron-builder throws without one. so `pnpm package` passes it as -c.mac.icon only when this
  # mac can compile it (scripts/icon-arg.mjs), and CI always does. this picture is that icon
  # rendered once: macOS has no glass to draw from it, and no dark, clear or tinted style
  icon: resources/icon.png
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
  # ad-hoc: an arm64 mac refuses to run a binary with no signature at all
  identity: "-"
  hardenedRuntime: false
  notarize: false

# the usual drag-to-install window
dmg:
  title: ${productName}
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 150
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
